services:
  # Web Service - FastAPI Backend
  - type: web
    name: suoops-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Run database migrations after build, before the new version goes live.
    preDeployCommand: bash release.sh
    # --max-requests recycles the worker every ~800 requests (±200 jitter) to
    # release accumulated memory/heap fragmentation before it can OOM a 512MB
    # Starter instance. Restarts are graceful (gunicorn spins a new worker first).
    startCommand: gunicorn app.api.main:app -k uvicorn.workers.UvicornWorker -w 1 --threads 2 --timeout 60 --max-requests 800 --max-requests-jitter 200 --bind 0.0.0.0:$PORT
    healthCheckPath: /ready
    envVars:
      # Shared secrets (Brevo, WhatsApp, SES, etc.) live in ONE group linked to
      # both web + worker so they can never drift apart. Create the group in the
      # Render dashboard (Environment Groups > "suoops-shared") before syncing.
      - fromGroup: suoops-shared
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENV
        value: production
      # Cap glibc malloc arenas. Threaded Python on Linux can balloon RSS with up
      # to 8×CPU per-thread arenas; pinning to 2 typically cuts RSS 30–50% and is
      # what keeps this app inside the 512MB Starter limit. No code/behaviour change.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: suoops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: suoops-redis
          type: redis
          property: connectionString

  # Background Worker - Celery
  # IMPORTANT: keep this at a SINGLE instance. The worker embeds --beat, so
  # running multiple instances risks duplicate scheduled tasks (reminders,
  # summaries) and multiplies cost. Throughput is scaled via --concurrency
  # INSIDE one instance, never by adding instances. (A drifted dashboard
  # scale-up to ~12 instances cost ~$86/mo in Jun 2026 vs ~$7 expected.)
  - type: worker
    name: suoops-worker
    runtime: python
    region: oregon
    plan: starter
    scaling:
      minInstances: 1
      maxInstances: 1
    buildCommand: pip install -r requirements.txt
    # --max-tasks-per-child recycles each worker process after 200 tasks to
    # release memory; MALLOC_ARENA_MAX (below) curbs RSS bloat on the 512MB box.
    startCommand: celery -A app.workers.celery_app worker --beat --loglevel=info --concurrency=4 --max-tasks-per-child=200
    envVars:
      # Same shared group as the web service — guarantees both have identical secrets.
      - fromGroup: suoops-shared
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENV
        value: production
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: suoops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: suoops-redis
          type: redis
          property: connectionString

databases:
  - name: suoops-db
    plan: starter
    region: oregon
    postgresMajorVersion: "16"

# Redis is now a native Render service
